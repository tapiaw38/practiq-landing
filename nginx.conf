server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro emits real HTML per route (index.html, privacidad/index.html,
    # terminos/index.html) — no SPA fallback needed, just pretty-URL directory
    # lookups and a real 404 for anything else.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.ico {
        log_not_found off;
    }
}
